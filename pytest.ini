[pytest]
# tests/unit/test_llm.py and tests/benchmark/ import from the `echotales` package,
# which was never vendored into this repo. They are unported Echotales carryovers
# (see README's "Reused Infrastructure" note) and cannot be collected until ported.
addopts = --ignore=tests/unit/test_llm.py --ignore=tests/benchmark
